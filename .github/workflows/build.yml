name: Build SukiSU for RMX3461 (Q3s)

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: https://github.com/realme-kernel-opensource/realme_GTmaster_Q3s_Q3t_9-5G-Speed-AndroidT-kernel-source
  KERNEL_SOURCE_BRANCH: master
  KERNEL_CONFIG: taro_defconfig  # 修正为778G的正确代号
  ARCH: arm64
  CLANG_VERSION: r450784e

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt-get update
        # 注意这里：把 python3-distutils 换成了 python3-dev，或者直接删掉 python3-distutils 也可以
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python3-dev cpio
    - name: Download Clang
      run: |
        mkdir -p clang
        cd clang
        wget -q https://github.com/LineageOS/android_prebuilts_clang_kernel/releases/download/clang-${{ env.CLANG_VERSION }}/clang-${{ env.CLANG_VERSION }}.tar.gz
        tar -xzf clang-${{ env.CLANG_VERSION }}.tar.gz --strip-components=1
        cd ..

    - name: Download GCC ARM64
      run: |
        mkdir -p gcc64
        cd gcc64
        wget -q https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/releases/download/gcc-4.9/gcc.tar.gz
        tar -xzf gcc.tar.gz --strip-components=1
        cd ..

    - name: Download GCC ARM32
      run: |
        mkdir -p gcc32
        cd gcc32
        wget -q https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9/releases/download/gcc-4.9/gcc.tar.gz
        tar -xzf gcc.tar.gz --strip-components=1
        cd ..

    - name: Clone kernel source
      run: |
        git clone --depth=1 -b ${{ env.KERNEL_SOURCE_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel

    - name: Setup SukiSU
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Android-Team/KernelSU/main/kernel/setup.sh" | bash
        
        echo "CONFIG_KSU=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KPROBES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_HAVE_KPROBES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_OVERLAY_FS=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}

    - name: Build kernel
      run: |
        cd kernel
        export PATH="${GITHUB_WORKSPACE}/clang/bin:${GITHUB_WORKSPACE}/gcc64/bin:${GITHUB_WORKSPACE}/gcc32/bin:$PATH"
        export ARCH=${{ env.ARCH }}
        export SUBARCH=${{ env.ARCH }}
        
        make O=out ${{ env.KERNEL_CONFIG }}
        make -j$(nproc --all) O=out \
          ARCH=${{ env.ARCH }} \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LLVM=1 \
          LLVM_IAS=1

    - name: Check kernel
      run: |
        if [ -f kernel/out/arch/${{ env.ARCH }}/boot/Image.gz-dtb ]; then
          echo "Found Image.gz-dtb"
          cp kernel/out/arch/${{ env.ARCH }}/boot/Image.gz-dtb kernel/out/arch/${{ env.ARCH }}/boot/Image
        elif [ -f kernel/out/arch/${{ env.ARCH }}/boot/Image.gz ]; then
          echo "Found Image.gz"
          cp kernel/out/arch/${{ env.ARCH }}/boot/Image.gz kernel/out/arch/${{ env.ARCH }}/boot/Image
        else
          echo "Kernel build failed or file not found!"
          exit 1
        fi

    - name: Setup AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cp kernel/out/arch/${{ env.ARCH }}/boot/Image AnyKernel3/
        cp kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img AnyKernel3/ || true

    - name: Configure AnyKernel3
      run: |
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/block=\/dev\/block\/boot/block=\/dev\/block\/by-name\/boot/g' anykernel.sh
        rm -rf .git

    - name: Create flashable zip
      run: |
        cd AnyKernel3
        zip -r9 ../SukiSU-Q3s-$(date +%Y%m%d).zip * -x .git README.md *placeholder

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Q3s
        path: SukiSU-Q3s-*.zip

name: Build SukiSU for RMX3461 (Q3s)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖（终极修复版）
        run: |
          sudo dpkg --add-architecture i386
          echo "deb http://archive.ubuntu.com/ubuntu focal main universe multiverse" | sudo tee /etc/apt/sources.list.d/focal.list
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev:i386 \
            lib32z1-dev \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            git \
            wget \
            curl
          sudo ln -s /usr/lib32/libncurses.so.6 /usr/lib32/libncurses.so.5
          sudo ln -s /usr/lib32/libtinfo.so.6 /usr/lib32/libtinfo.so.5

      - name: 下载 Clang 工具链
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "PATH=${GITHUB_WORKSPACE}/clang/bin:${PATH}" >> $GITHUB_ENV

      - name: 下载 GCC ARM64/ARM32 交叉编译器
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm32
          echo "CROSS_COMPILE_ARM64=${GITHUB_WORKSPACE}/gcc-arm64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=${GITHUB_WORKSPACE}/gcc-arm32/bin/arm-linux-androideabi-" >> $GITHUB_ENV

      - name: 克隆内核源码
        uses: actions/checkout@v4
        with:
          repository: sh-sheng/KernelSU-RMX3461
          path: kernel
          fetch-depth: 1

      - name: 配置 SukiSU
        run: |
          cd kernel
          # 这里可以替换成你自己的SukiSU配置命令

      - name: 构建内核
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CC=clang CROSS_COMPILE=${CROSS_COMPILE_ARM64} CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} RMX3461_defconfig
          make -j$(nproc) ARCH=arm64 CC=clang CROSS_COMPILE=${CROSS_COMPILE_ARM64} CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32}

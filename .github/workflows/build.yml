name: Build KernelSU for RMX3461

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: https://github.com/realme-kernel-opensource/realme_GTmaster_Q3s_Q3t_9-5G-Speed-AndroidT-kernel-source
  KERNEL_SOURCE_BRANCH: master
  KERNEL_CONFIG: lahaina_defconfig
  ARCH: arm64
  CLANG_VERSION: r416183b

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3 cpio

    - name: Download Clang
      run: |
        mkdir -p clang
        cd clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-${{ env.CLANG_VERSION }}.tar.gz
        tar -xzf clang-${{ env.CLANG_VERSION }}.tar.gz
        cd ..

    - name: Download GCC ARM64
      run: |
        mkdir -p gcc64
        cd gcc64
        wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz
        tar -xzf android12-release.tar.gz
        cd ..

    - name: Download GCC ARM32
      run: |
        mkdir -p gcc32
        cd gcc32
        wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/android12-release.tar.gz
        tar -xzf android12-release.tar.gz
        cd ..

    - name: Clone kernel source
      run: |
        git clone --depth=1 -b ${{ env.KERNEL_SOURCE_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel

    - name: Setup KernelSU
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
        
        # Enable KernelSU in defconfig
        echo "CONFIG_KSU=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KPROBES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_HAVE_KPROBES=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/${{ env.ARCH }}/configs/${{ env.KERNEL_CONFIG }}

    - name: Build kernel
      run: |
        cd kernel
        export PATH="${GITHUB_WORKSPACE}/clang/bin:${GITHUB_WORKSPACE}/gcc64/bin:${GITHUB_WORKSPACE}/gcc32/bin:$PATH"
        export ARCH=${{ env.ARCH }}
        export SUBARCH=${{ env.ARCH }}
        
        make O=out ${{ env.KERNEL_CONFIG }}
        make -j$(nproc --all) O=out \
          ARCH=${{ env.ARCH }} \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LLVM=1 \
          LLVM_IAS=1

    - name: Check kernel
      run: |
        if [ -f kernel/out/arch/${{ env.ARCH }}/boot/Image ]; then
          echo "Kernel built successfully!"
          ls -la kernel/out/arch/${{ env.ARCH }}/boot/
        else
          echo "Kernel build failed!"
          exit 1
        fi

    - name: Setup AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        cp kernel/out/arch/${{ env.ARCH }}/boot/Image AnyKernel3/
        if [ -f kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img ]; then
          cp kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img AnyKernel3/
        fi

    - name: Configure AnyKernel3
      run: |
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/do.modules=0/do.modules=0/g' anykernel.sh
        rm -rf .git

    - name: Create flashable zip
      run: |
        cd AnyKernel3
        zip -r9 ../KernelSU-RMX3461-$(date +%Y%m%d).zip * -x .git README.md *placeholder

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-RMX3461
        path: KernelSU-RMX3461-*.zip
